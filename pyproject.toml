[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beatforge"
version = "0.1.0"
description = "Song-to-beatmap mapper: audio analysis to Beat Saber custom maps"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "librosa>=0.10",
  "soundfile>=0.12",
  "numpy>=1.26",
  "scipy>=1.11",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
  "pydantic>=2.6",
  "httpx>=0.27",
  "scikit-learn>=1.4",
  "imageio-ffmpeg>=0.6",
  "Pillow>=10.4",
  "mutagen>=1.47",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "playwright==1.55.0"]

[project.scripts]
beatforge = "beatforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tools"]
markers = [
  "corpus: live local Beat Saber install and official corpus; tests skip themselves when missing",
  "network: live outbound network; tests skip themselves when unreachable",
  "hardware: live GPU or headset; tests skip themselves when missing",
  "codex: live Codex credentials; tests skip themselves when missing",
]
